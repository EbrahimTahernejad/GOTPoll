name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
          - name: macOS arm64
            os: macos-15 # Apple Silicon runner (macos-14 is retired November 2026)
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm build ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: GOTPoll-${{ matrix.platform }}
          path: |
            build/dist/*.exe
            build/dist/*.AppImage
            build/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
